<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Awardees Map</title>
    <link href="https://maxcdn.bootstrapcdn.com/font-awesome/4.2.0/css/font-awesome.min.css" rel="stylesheet">

    <link href="https://maxcdn.bootstrapcdn.com/bootstrap/3.0.2/css/bootstrap.min.css" rel="stylesheet" media="all">

    <link href="https://cdnjs.cloudflare.com/ajax/libs/datatables/1.10.10/css/dataTables.bootstrap.min.css" rel="stylesheet" media="all">

    <link href='https://api.mapbox.com/mapbox-gl-js/v3.7.0/mapbox-gl.css' rel='stylesheet' media="all"/>

    <link href="css/styles.css" rel="stylesheet">

    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.5.1/jquery.min.js"></script>

    <script>
      (function() {
          var so = document.createElement('script');
          so.type = 'text/javascript';
          so.async = true;
          so.src = 'https://www.eere.energy.gov/includes/ga/eere.js';
          var s = document.getElementsByTagName('script')[0];
          s.parentNode.insertBefore(so, s);
      })();
    </script>

</head>
<body>

<div class="container">
    <div class="row">
        <div class="col-sm-3">
            <div id="ui-controls"></div>
        </div>
        <div class="col-sm-9">
            <div class="map">
                <div id="map" class="mapbox-map"></div>
                <div class="map-navigation">
                    <a href="#" data-position="62,-153" class="btn btn-default"><img src="images/icon-alaska.png" class="img-responsive" alt="Alaska"><span class="badge" id="count-alaska"></span></a>
                </div>
            </div>
        </div>
    </div>
    <div class="row">
        <div class="col-sm-12">
            <table id="datatable" class="table table-striped table-condensed"></table>
        </div>
    </div>
</div>


<!-- Libraries -->
<script src="https://maxcdn.bootstrapcdn.com/bootstrap/3.0.2/js/bootstrap.min.js"></script>

<script src="https://cdnjs.cloudflare.com/ajax/libs/datatables/1.10.10/js/jquery.dataTables.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/datatables/1.10.10/js/dataTables.bootstrap.min.js"></script>

<!-- End Libraries -->




<script src="https://api.mapbox.com/mapbox-gl-js/v3.7.0/mapbox-gl.js"></script>
<script src="js/geojson.min.js"></script>
<script src="js/config.js?v=2"></script>
<script src="js/spider.js"></script>
<script src="js/app.js?v=2"></script>


</body>
</html>
